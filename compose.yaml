services:
  postgres:
    image: postgres:18-alpine
    container_name: mini-wsa-postgres
    environment:
      POSTGRES_DB: wsa
      POSTGRES_USER: wsauser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wsauser -d wsa" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mini-wsa-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wsa
      SPRING_DATASOURCE_USERNAME: wsauser
      SPRING_DATASOURCE_PASSWORD: secret
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: