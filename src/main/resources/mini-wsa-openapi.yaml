openapi: 3.0.3
info:
  title: Mini Security Analytics Pipeline (Mini WSA) API
  version: 1.0.0
  description: API contract for ingesting security event logs and querying analytics in the Mini WSA platform.
servers:
  - url: http://localhost:8080
paths:
  /v1/events/ingest:
    post:
      summary: Ingest security event records
      operationId: ingestEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '201':
          description: Events successfully ingested
        '400':
          description: Validation error or invalid schema

  /v1/events/samples:
    get:
      summary: Get security event records
      operationId: getSamples
      description: Returns samples of security event records for a given configuration and time range.
      parameters:
        - name: configId
          in: query
          required: false
          description: The unique identifier of the configuration.
          schema:
            type: integer
            format: int64
            example: 14227
        - name: from
          in: query
          required: false
          description: The start date and time of the range in ISO 8601 format.
          schema:
            type: string
            format: date-time
            example: "2026-10-12T00:00:00Z"
        - name: to
          in: query
          required: false
          description: The end date and time of the range in ISO 8601 format.
          schema:
            type: string
            format: date-time
            example: "2026-10-12T23:59:59Z"
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter results by category.
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: Filter results by action.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
          description: The number of items to return.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: The number of items to skip before starting to return elements.
      responses:
        '200':
          description: Successfully retrieved samples of security event records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfSecurityEvent'
        '400':
          description: Invalid query parameters or bad request.
  /v1/stats/summary:
    get:
      summary: Get aggregated statistics
      operationId: getSummary
      description: Returns aggregated statistics for a given configuration and time range.
      parameters:
        - name: configId
          in: query
          required: false
          description: The unique identifier of the configuration.
          schema:
            type: integer
            format: int64
            example: 14227
        - name: from
          in: query
          required: true
          description: The start date and time of the range in ISO 8601 format.
          schema:
            type: string
            format: date-time
            example: "2026-10-12T00:00:00Z"
        - name: to
          in: query
          required: true
          description: The end date and time of the range in ISO 8601 format.
          schema:
            type: string
            format: date-time
            example: "2026-10-12T23:59:59Z"
      responses:
        '200':
          description: Successfully retrieved stats summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSummaryResponse'
        '400':
          description: Invalid query parameters or bad request.

components:
  schemas:
    IngestRequest:
      type: object
      oneOf:
        - required:
            - event
        - required:
            - events
      properties:
        event:
          $ref: '#/components/schemas/SecurityEvent'
        events:
          type: array
          items:
            $ref: '#/components/schemas/SecurityEvent'

    SecurityEvent:
      type: object
      required:
        - eventId
        - timestamp
        - configId
        - policyId
        - clientIp
        - hostname
        - path
        - rule
        - action
      properties:
        eventId:
          type: string
          example: evt-00132
        timestamp:
          type: string
          format: date-time
          example: '2026-05-20T14:32:10Z'
        configId:
          type: integer
          format: int64
          example: 14227
        policyId:
          type: string
          example: pol-7
        clientIp:
          type: string
          example: 203.0.113.42
        hostname:
          type: string
          example: www.example.com
        path:
          type: string
          example: /api/v1/login
        rule:
          $ref: '#/components/schemas/Rule'
        action:
          $ref: '#/components/schemas/SecurityAction'
      additionalProperties: true

    SecurityAction:
      type: string
      enum:
        - DENY
        - ALERT
        - MONITOR
      example: DENY

    PageOfSecurityEvent:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EnrichedSecurityEvent'
        totalPages:
          type: integer
        totalElements:
          type: integer
        size:
          type: integer
        number:
          type: integer

    EnrichedSecurityEvent:
      allOf:
        - $ref: '#/components/schemas/SecurityEvent'
        - type: object
          required:
            - receivedAt
            - threatScore
            - attackType
            - rawPayload
          properties:
            receivedAt:
              type: string
              format: date-time
              example: '2026-05-20T14:32:10Z'
            threatScore:
              type: integer
              minimum: 0
              maximum: 100
              example: 80
            attackType:
              type: string
              description: 'Type of attack according to configuration'
            rawPayload:
              additionalProperties: true

    Rule:
      type: object
      required:
        - id
        - severity
        - category
      additionalProperties: true
      properties:
        id:
          type: string
          description: Stable identifier of the rule definition.
          example: '950001'
        name:
          type: string
          example: SQL Injection Attack
        message:
          type: string
          description: Detail about this specific match; can differ per event for the same rule.
          example: SQLi detected in query string
        severity:
          type: string
          enum:
            - CRITICAL
            - HIGH
            - MEDIUM
            - LOW
          example: CRITICAL
        category:
          type: string
          enum:
            - INJECTION
            - XSS
            - PROTOCOL_VIOLATION
            - DATA_LEAKAGE
            - BOT
            - DOS
            - RATE_LIMIT
          example: INJECTION

    StatsSummaryResponse:
      type: object
      required:
        - timeRange
        - totalEvents
        - byCategory
        - byAction
        - topAttackers
        - topTargetedPaths
      properties:
        configId:
          type: integer
          format: int64
          example: 14227
        timeRange:
          type: object
          required:
            - from
            - to
          properties:
            from:
              type: string
              format: date-time
              example: "2026-10-12T00:00:00Z"
            to:
              type: string
              format: date-time
              example: "2026-10-12T23:59:59Z"
        totalEvents:
          type: integer
          format: int64
          example: 1523
        byCategory:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CategoryMetrics'
          example:
            INJECTION:
              count: 450
              avgThreatScore: 72.3
            BOT:
              count: 380
              avgThreatScore: 45.1
        byAction:
          type: object
          additionalProperties:
            type: integer
            format: int64
          example:
            DENY: 890
            ALERT: 433
            MONITOR: 200
        topAttackers:
          type: array
          items:
            $ref: '#/components/schemas/AttackerMetric'
        topTargetedPaths:
          type: array
          items:
            $ref: '#/components/schemas/PathMetric'

    CategoryMetrics:
      type: object
      required:
        - count
        - avgThreatScore
      properties:
        count:
          type: integer
          format: int64
          example: 450
        avgThreatScore:
          type: number
          format: double
          example: 72.3

    AttackerMetric:
      type: object
      required:
        - clientIp
        - count
        - avgThreatScore
      properties:
        clientIp:
          type: string
          format: ipv4
          example: "203.0.113.42"
        count:
          type: integer
          format: int64
          example: 87
        avgThreatScore:
          type: number
          format: double
          example: 81.2

    PathMetric:
      type: object
      required:
        - path
        - count
      properties:
        path:
          type: string
          example: "/api/v1/login"
        count:
          type: integer
          format: int64
          example: 234
