spring:
  application:
    name: mini-wsa
  datasource:
    url: jdbc:postgresql://localhost:5432/wsa
    username: wsauser
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Never use in production
    show-sql: false # set to true for debug
    properties:
      hibernate:
        format_sql: true
  data:
    web:
      pageable:
        size-parameter: limit

mini-wsa:
  categories:
    INJECTION: SQL/Command Injection
    XSS: Cross-Site Scripting
    PROTOCOL_VIOLATION: Protocol Anomaly
    DATA_LEAKAGE: Data Exfiltration
    BOT: Bot Activity
    DOS: Denial of Service
    RATE_LIMIT: Rate Limiting
  severities:
    CRITICAL: 40
    HIGH: 30
    MEDIUM: 20
    LOW: 10
  actions:
    DENY: 20
    ALERT: 10
    MONITOR: 0
  sensitive-paths-score: 15
  sensitive-paths:
    - /admin
    - /login
  rules:
    - count: 5
      window-minutes: 10
      matching-field: clientIp
      score: 15